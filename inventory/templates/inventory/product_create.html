{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <div class="mb-4">
        <h2>Add Product</h2>
        <p class="text-muted">
            Add a new product to your inventory
        </p>
    </div>

    <div class="card shadow">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <!-- Product Name -->
                <div class="mb-3">
                    <label class="form-label">
                        Product Name
                    </label>

                    <input
                        type="text"
                        name="Name"
                        class="form-control"
                        placeholder="Enter product name"
                        required
                    >
                </div>


                <!-- Barcode -->
                <div class="mb-3">
                    <label class="form-label">
                        Barcode
                    </label>

                    <input
                        type="text"
                        name="Barcode"
                        class="form-control"
                        placeholder="Enter barcode"
                    >
                </div>


                <!-- Category -->
                <div class="mb-3">
                    <label class="form-label">
                        Category
                    </label>

                    <select
                        name="Category"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Category
                        </option>

                        {% for category in categories %}

                            <option value="{{ category.CT_Id }}">
                                {{ category.Name }}
                            </option>

                        {% endfor %}

                    </select>
                </div>


                <!-- Cost Price -->
                <div class="mb-3">
                    <label class="form-label">
                        Cost Price
                    </label>

                    <input
                        type="number"
                        name="CostPrice"
                        class="form-control"
                        step="0.01"
                        min="0"
                        required
                    >
                </div>


                <!-- Selling Price -->
                <div class="mb-3">
                    <label class="form-label">
                        Selling Price
                    </label>

            
                    <input
                        type="number"
                        name="UnitPrice"
                        class="form-control"
                        step="1"
                        min="0"
                        required
                    >
                </div>


                <!-- Current Stock -->
                <div class="mb-3">
                    <label class="form-label">
                        Current Stock
                    </label>

                    <input
                        type="number"
                        name="CurrentStock"
                        class="form-control"
                        min="0"
                        value="0"
                        required
                    >
                </div>


                <!-- Buttons -->
                <div class="mt-4">

                    <button 
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Product
                    </button>

                    <a
                        
                        href="{% url 'product_list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
