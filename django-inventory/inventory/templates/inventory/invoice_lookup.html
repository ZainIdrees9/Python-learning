{% extends 'base.html' %}

{% block content %}

<div class="container-fluid py-4">

    <!-- ====================================================
         PAGE HEADER
    ===================================================== -->

    <div class="mb-4">

        <h2 class="mb-1">
            Invoice Quick Lookup
        </h2>

        <p class="text-muted mb-0">
            Quickly find an invoice using its invoice number.
        </p>

    </div>


    <!-- ====================================================
         LOOKUP CARD
    ===================================================== -->

    <div class="card shadow-sm">

        <div class="card-header bg-white">

            <h5 class="mb-0">

                <i class="bi bi-search"></i>

                Search Invoice

            </h5>

        </div>


        <div class="card-body">

            <form method="GET"
                  action="{% url 'inventory:invoice_lookup' %}">

                <div class="row g-3 align-items-end">

                    <!-- ====================================================
                         INVOICE NUMBER
                    ===================================================== -->

                    <div class="col-md-8">

                        <label for="invoice_id"
                               class="form-label">

                            Invoice Number

                        </label>

                        <input type="number"
                               name="invoice_id"
                               id="invoice_id"
                               class="form-control"
                               placeholder="Enter invoice number"
                               value="{{ invoice_id }}"
                               min="1"
                               required>

                    </div>


                    <!-- ====================================================
                         SEARCH BUTTON
                    ===================================================== -->

                    <div class="col-md-4">

                        <button type="submit"
                                class="btn btn-primary w-100">

                            <i class="bi bi-search"></i>

                            Find Invoice

                        </button>

                    </div>

                </div>

            </form>


            <!-- ====================================================
                 ERROR MESSAGE
            ===================================================== -->

            {% if error %}

                <div class="alert alert-danger mt-4 mb-0">

                    <i class="bi bi-exclamation-circle me-2"></i>

                    {{ error }}

                </div>

            {% endif %}

        </div>

    </div>


    <!-- ====================================================
         BACK TO SALES
    ===================================================== -->

    <div class="mt-4">

        <a href="{% url 'inventory:sale_list' %}"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left"></i>

            Back to Sales

        </a>

    </div>

</div>

{% endblock %}
